[project]
name = "pi-panel-app-music"
version = "0.1.0"
description = "pi-panel app: an Apple Music-style now-playing screen for Music Assistant or Home Assistant"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# GTK (PyGObject) is deliberately not listed: it comes from apt and is seen
# through the venv's --system-site-packages (see pi-panel.toml).
dependencies = [
    # Both backends are JSON over a WebSocket.
    "websockets>=14,<16",
    "pi-panel-varlink",
]

[project.scripts]
pi-panel-music = "pi_panel_music.__main__:main"

# Installed by pi-panel-pkg into ~/pi-panel-apps/music, next to ~/pi-panel-core.
[tool.uv.sources]
pi-panel-varlink = { path = "../../pi-panel-core/pi-panel-core-ctl/packages/pi-panel-varlink" }

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pi_panel_music"]

[tool.pytest.ini_options]
testpaths = ["tests"]
